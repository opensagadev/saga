---
name: Tests

# GitHub Actions requires this key even though YAML 1.1 treats it as truthy.
# yamllint disable-line rule:truthy
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  tests:
    name: Tests / Linux i686 (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug
            config: ""
          - name: release
            config: --config=native_release
    steps:
      - uses: actions/checkout@v4

      - name: Install 32-bit C++ runtime and GLES headers
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-multilib libgles-dev

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: bazel-${{ github.workflow }}-${{ matrix.name }}
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Run regression tests
        run: bazel test ${{ matrix.config }} //tests/...
