<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SAGA WebAssembly</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111318;
        color: #f2f3f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 20rem;
        min-height: 100vh;
        margin: 0;
        background: #111318;
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 1px solid #7d8798;
        border-radius: 0.45rem;
        background: #e8ebef;
        color: #17191d;
        cursor: pointer;
        font-weight: 650;
        padding: 0.7rem 1rem;
      }

      button:hover {
        background: #fff;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #87a8ff;
        outline-offset: 2px;
      }

      button:disabled,
      input:disabled {
        cursor: wait;
        opacity: 0.55;
      }

      #launcher[hidden] {
        display: none;
      }

      .shell {
        width: min(44rem, calc(100% - 2rem));
        margin: 0 auto;
        padding: clamp(2.5rem, 8vw, 6rem) 0 2rem;
      }

      header {
        margin-bottom: 1.75rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3.5rem);
        letter-spacing: -0.04em;
      }

      header p,
      .hint {
        color: #a8afb9;
        line-height: 1.6;
      }

      #play-button,
      #local-obb-load {
        width: 100%;
        margin-top: 1rem;
      }

      #local-obb-load[hidden] {
        display: none;
      }

      header p {
        margin: 0.55rem 0 0;
      }

      .panel {
        border: 1px solid #303641;
        border-radius: 0.7rem;
        background: #191c22;
        padding: clamp(1.1rem, 4vw, 1.6rem);
      }

      .status {
        display: flex;
        align-items: flex-start;
        gap: 0.7rem;
        margin-bottom: 1.4rem;
        line-height: 1.45;
      }

      .status-dot {
        width: 0.65rem;
        height: 0.65rem;
        flex: 0 0 auto;
        margin-top: 0.35rem;
        border: 2px solid #91a9ef;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 800ms linear infinite;
      }

      #status.ready .status-dot {
        border: 0;
        background: #69c98f;
        animation: none;
      }

      #status.error {
        color: #ff9e9e;
      }

      #status.error .status-dot {
        border: 0;
        background: #e76b6b;
        animation: none;
      }

      .field {
        margin-top: 1.2rem;
      }

      .field label {
        display: block;
        margin-bottom: 0.45rem;
        font-size: 0.85rem;
        font-weight: 650;
      }

      input[type="file"] {
        width: 100%;
        color: #cdd2da;
      }

      input[type="file"]::file-selector-button {
        margin-right: 0.8rem;
        border: 1px solid #535c6c;
        border-radius: 0.4rem;
        background: #272c35;
        color: #f2f3f5;
        cursor: pointer;
        padding: 0.6rem 0.8rem;
      }

      .url-form {
        display: flex;
        gap: 0.55rem;
      }

      .url-form input {
        min-width: 0;
        flex: 1;
        border: 1px solid #404754;
        border-radius: 0.45rem;
        background: #101217;
        color: #f2f3f5;
        padding: 0.7rem 0.8rem;
      }

      .hint {
        margin: 1.4rem 0 0;
        font-size: 0.8rem;
      }

      #game {
        display: none;
        position: fixed;
        inset: 0;
        background: #000;
      }

      #game.running {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #canvas {
        max-width: 100%;
        max-height: 100%;
        outline: 0;
      }

      #runtime-error {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 2;
        max-width: min(34rem, calc(100% - 2rem));
        border: 1px solid #7d4148;
        border-radius: 0.5rem;
        background: #321a1e;
        color: #ffd7da;
        padding: 0.9rem 1rem;
        white-space: pre-wrap;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @media (max-width: 34rem) {
        .url-form {
          flex-direction: column;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .status-dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="launcher" class="shell">
      <header>
        <h1>SAGA</h1>
        <p>WebAssembly development build</p>
      </header>

      <section class="panel" aria-label="Game data">
        <div id="status" class="status" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-text">Looking for game data…</span>
        </div>

        <div class="field">
          <label for="obb-file">Local OBB</label>
          <input id="obb-file" type="file" accept=".obb,application/octet-stream">
        </div>

        <form id="url-form" class="field">
          <label for="obb-url">Remote OBB or Archive.org item</label>
          <div class="url-form">
            <input id="obb-url" type="url" inputmode="url" autocomplete="url" placeholder="https://…" required>
            <button id="url-submit" type="submit">Load</button>
          </div>
        </form>

        <button id="local-obb-load" type="button" hidden>Load detected OBB</button>
        <button id="play-button" type="button" disabled>Play</button>

        <p class="hint">When the development server finds the expected OBB under <code>res/</code>, it waits for
          permission before loading it. The game starts only when you press Play.</p>
      </section>
    </main>

    <div id="game" aria-label="Game viewport">
      <canvas id="canvas" tabindex="-1" aria-label="SAGA game" oncontextmenu="event.preventDefault()"></canvas>
    </div>
    <div id="runtime-error" role="alert" hidden></div>

    <script>
      const launcher = document.getElementById("launcher");
      const game = document.getElementById("game");
      const canvas = document.getElementById("canvas");
      const fileInput = document.getElementById("obb-file");
      const urlForm = document.getElementById("url-form");
      const urlInput = document.getElementById("obb-url");
      const urlSubmit = document.getElementById("url-submit");
      const localObbLoad = document.getElementById("local-obb-load");
      const playButton = document.getElementById("play-button");
      const status = document.getElementById("status");
      const statusText = document.getElementById("status-text");
      const runtimeError = document.getElementById("runtime-error");
      const obbName = "main.1060.com.wb.lego.tcs.obb";
      let resolveRuntime;
      let started = false;
      let loadedObb = null;
      let detectedObbUrl = null;
      const runtimeReady = new Promise((resolve) => {
        resolveRuntime = resolve;
      });

      function setStatus(message, isError = false, isReady = false) {
        statusText.textContent = message;
        status.classList.toggle("error", isError);
        status.classList.toggle("ready", isReady);
      }

      function setBusy(busy) {
        fileInput.disabled = busy;
        urlInput.disabled = busy;
        urlSubmit.disabled = busy;
        localObbLoad.disabled = busy;
        playButton.disabled = busy || loadedObb === null;
      }

      function showRuntimeError(error) {
        const message = error instanceof Error ? error.message : String(error);
        runtimeError.textContent = message;
        runtimeError.hidden = false;
        console.error(error);
      }

      async function readResponse(response, label) {
        const size = Number(response.headers.get("content-length"));
        if (!response.body || !Number.isSafeInteger(size) || size <= 0) {
          return response.arrayBuffer();
        }

        const reader = response.body.getReader();
        const data = new Uint8Array(size);
        let offset = 0;
        while (true) {
          const { done, value: chunk } = await reader.read();
          if (done) {
            break;
          }
          if (offset + chunk.byteLength > data.byteLength) {
            throw new Error("The OBB was larger than the server reported.");
          }
          data.set(chunk, offset);
          offset += chunk.byteLength;
          setStatus(`${label} ${Math.floor(offset * 100 / size)}%`);
        }
        if (offset !== size) {
          throw new Error("The OBB transfer was incomplete.");
        }
        return data.buffer;
      }

      async function fetchUrl(url, label) {
        let response;
        try {
          response = await fetch(url);
        } catch (error) {
          throw new Error("The OBB source blocked this browser download. It must allow cross-origin requests.");
        }
        if (!response.ok) {
          throw new Error(`OBB download failed: HTTP ${response.status}`);
        }
        if ((response.headers.get("content-type") || "").includes("text/html")) {
          throw new Error("The URL returned a web page instead of an OBB.");
        }
        return readResponse(response, label);
      }

      async function loadObb(load, label) {
        setBusy(true);
        setStatus(label);
        try {
          const [buffer] = await Promise.all([load(), ensureRuntimeLoaded()]);
          if (!buffer.byteLength) {
            throw new Error("The selected OBB is empty.");
          }
          loadedObb = buffer;
          setBusy(false);
          setStatus("Game data ready — press Play.", false, true);
        } catch (error) {
          loadedObb = null;
          setBusy(false);
          setStatus(error instanceof Error ? error.message : String(error), true);
          throw error;
        }
      }

      function startGame() {
        if (started || loadedObb === null) {
          return;
        }
        started = true;
        setBusy(true);
        setStatus("Starting game…");
        try {
          const buffer = loadedObb;
          loadedObb = null;
          Module.FS.mkdirTree("/res");
          Module.FS.writeFile(
            "/res/main.1060.com.wb.lego.tcs.obb",
            new Uint8Array(buffer),
            { canOwn: true },
          );
          launcher.hidden = true;
          game.classList.add("running");
          canvas.focus();
          Module.callMain([]);
        } catch (error) {
          started = false;
          setBusy(false);
          setStatus(error instanceof Error ? error.message : String(error), true);
          throw error;
        }
      }

      async function resolveObbUrl(value) {
        const url = new URL(value);
        const pathParts = url.pathname.split("/").filter(Boolean);
        if (url.hostname.endsWith("archive.org") && pathParts[0] === "details" && pathParts[1]) {
          const identifier = decodeURIComponent(pathParts[1]);
          setStatus("Finding OBB in Archive.org item…");
          const metadataUrl = `https://archive.org/metadata/${encodeURIComponent(identifier)}`;
          const metadataResponse = await fetch(metadataUrl);
          if (!metadataResponse.ok) {
            throw new Error(`Archive.org metadata failed: HTTP ${metadataResponse.status}`);
          }
          const metadata = await metadataResponse.json();
          const obb = metadata.files.find((file) => file.name.toLowerCase().endsWith(".obb"));
          if (!obb) {
            throw new Error("The Archive.org item does not contain an OBB.");
          }
          const encodedName = obb.name.split("/").map(encodeURIComponent).join("/");
          return `https://archive.org/download/${encodeURIComponent(identifier)}/${encodedName}`;
        }
        return url.href;
      }

      async function loadServerObb() {
        try {
          const obbUrl = new URL(obbName, location.href);
          const available = await fetch(obbUrl, { method: "HEAD", cache: "no-store" });
          if (!available.ok) {
            setStatus("Choose an OBB to load.", false, true);
            return;
          }

          detectedObbUrl = obbUrl;
          localObbLoad.hidden = false;
          setStatus("Local OBB detected — load it when ready.", false, true);
        } catch (error) {
          setBusy(false);
          setStatus(`OBB check failed: ${error instanceof Error ? error.message : String(error)}`, true);
          console.error(error);
        }
      }

      fileInput.addEventListener("change", async () => {
        const file = fileInput.files[0];
        if (!file) {
          return;
        }
        setStatus(`Reading ${file.name}…`);
        try {
          await loadObb(() => file.arrayBuffer(), `Reading ${file.name}…`);
        } catch (error) {
          console.error(error);
        }
      });

      urlForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        setBusy(true);
        try {
          const resolvedUrl = await resolveObbUrl(urlInput.value);
          await loadObb(() => fetchUrl(resolvedUrl, "Downloading OBB…"), "Downloading OBB…");
        } catch (error) {
          setBusy(false);
          setStatus(error instanceof Error ? error.message : String(error), true);
          console.error(error);
        }
      });

      localObbLoad.addEventListener("click", async () => {
        if (detectedObbUrl === null) {
          return;
        }
        try {
          await loadObb(async () => {
            const response = await fetch(detectedObbUrl);
            if (!response.ok) {
              throw new Error(`Local OBB failed: HTTP ${response.status}`);
            }
            return readResponse(response, "Loading local OBB…");
          }, "Loading local OBB…");
        } catch (error) {
          console.error(error);
        }
      });

      playButton.addEventListener("click", startGame);

      var Module = {
        canvas,
        noInitialRun: true,
        print: (...args) => console.log(...args),
        printErr: (...args) => console.error(...args),
        setStatus(message) {
          if (started && message) {
            setStatus(message);
          }
        },
        onRuntimeInitialized() {
          resolveRuntime();
        },
        onAbort: showRuntimeError,
      };

      window.addEventListener("error", (event) => {
        showRuntimeError(event.error || event.message);
      });
      window.addEventListener("unhandledrejection", (event) => {
        showRuntimeError(event.reason);
      });
      canvas.addEventListener("webglcontextlost", (event) => {
        event.preventDefault();
        showRuntimeError("The WebGL context was lost. Reload the page to restart the game.");
      });
      canvas.addEventListener("webglcontextcreationerror", (event) => {
        showRuntimeError(`WebGL context creation failed: ${event.statusMessage || "unknown browser error"}`);
      });

      function ensureRuntimeLoaded() {
        return runtimeReady;
      }

      void loadServerObb();
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
